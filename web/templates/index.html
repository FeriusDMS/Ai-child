<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>AI-Child 🌟</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header avec stats -->
        <div class="header">
            <div class="avatar-container">
                <img src="/static/avatar.svg" alt="AI-Child" class="avatar" id="avatar">
                <div class="status-indicator" id="status"></div>
            </div>
            <div class="stats">
                <h2 id="ai-name">AI-Child</h2>
                <div class="stats-row">
                    <span class="badge">Niveau <span id="level">1</span></span>
                    <span class="badge">💬 <span id="interactions">0</span></span>
                </div>
                <p class="description" id="description">Chargement...</p>
            </div>
        </div>

        <!-- Zone de conversation -->
        <div class="chat-container" id="chatContainer">
            <div class="welcome-message">
                <h3>👋 Bonjour !</h3>
                <p>Je suis ton AI-Child. Parle-moi et je vais grandir avec toi ! 😊</p>
            </div>
        </div>

        <!-- Zone de saisie -->
        <div class="input-container">
            <div class="controls-row">
                <button id="voiceBtn" class="control-btn" title="Activer/Désactiver la voix">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </button>
                <button id="micBtn" class="control-btn" title="Parler au lieu d'écrire">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                    </svg>
                </button>
            </div>
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Écris ton message..." 
                    autocomplete="off"
                >
                <button id="sendBtn" class="send-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 8L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
